<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">诗酒 / ASPshijiu — Neon Profile</title>
  <desc id="desc">A neon cyberpunk banner for a Minecraft modder, Android tinkerer and automation builder</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040611"/>
      <stop offset=".48" stop-color="#0d1023"/>
      <stop offset="1" stop-color="#1b0926"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset=".48" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9d5ff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2bd6"/>
      <stop offset="1" stop-color="#7e22ce"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#7c3aed" stop-opacity=".12"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#67e8f9" stroke-opacity=".075"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="420" rx="28"/>
    </clipPath>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="wideGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <circle cx="1030" cy="220" r="310" fill="url(#orb)"/>

    <g stroke="#8b5cf6" stroke-opacity=".12">
      <path d="M640 420 770 210M640 420 900 210M640 420 1030 210M640 420 1160 210M640 420 1290 210"/>
      <path d="M0 350H1280M0 305H1280M0 270H1280M0 242H1280M0 220H1280"/>
    </g>

    <g fill="#00f5ff">
      <rect x="42" y="35" width="10" height="10" rx="2">
        <animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="1178" y="54" width="9" height="9" rx="2">
        <animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="1220" y="86" width="5" height="5" rx="1"/>
      <rect x="1120" y="340" width="7" height="7" rx="1">
        <animate attributeName="opacity" values=".2;1;.2" dur="1.4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g fill="#ff2bd6">
      <rect x="1198" y="69" width="14" height="14" rx="3"/>
      <rect x="1088" y="366" width="11" height="11" rx="2"/>
      <rect x="74" y="372" width="7" height="7" rx="1">
        <animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="0" y="-34" width="1280" height="34" fill="url(#neon)" opacity=".08">
      <animate attributeName="y" values="-34;420" dur="5.8s" repeatCount="indefinite"/>
    </rect>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
      <rect x="62" y="48" width="190" height="32" rx="16" fill="#00f5ff" fill-opacity=".08" stroke="#00f5ff" stroke-opacity=".45"/>
      <circle cx="82" cy="64" r="5" fill="#65d46e">
        <animate attributeName="opacity" values=".35;1;.35" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="96" y="70" fill="#a5f3fc" font-size="14" font-weight="700" letter-spacing="1.4">SYSTEM ONLINE</text>

      <text x="62" y="117" fill="#94a3b8" font-size="16" font-weight="700" letter-spacing="3">PLAYER PROFILE // 01</text>

      <text x="57" y="203" fill="#00f5ff" opacity=".28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="78" font-weight="900">诗酒</text>
      <text x="67" y="203" fill="#ff2bd6" opacity=".28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="78" font-weight="900">诗酒</text>
      <text x="62" y="203" fill="url(#neon)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="78" font-weight="900">诗酒</text>

      <text x="62" y="251" fill="#f8fafc" font-size="34" font-weight="800" letter-spacing="1.2">ASPshijiu</text>
      <rect x="62" y="270" width="410" height="5" rx="2.5" fill="url(#neon)" filter="url(#glow)"/>

      <text x="62" y="315" fill="#cbd5e1" font-size="19" font-weight="600">MOD THE WORLD. AUTOMATE THE BORING.</text>
      <text x="62" y="346" fill="#7183a5" font-size="15" letter-spacing="1.5">MINECRAFT MODS  •  ANDROID  •  AUTOMATION</text>

      <g transform="translate(62 372)" font-size="12" font-weight="700">
        <rect width="68" height="25" rx="5" fill="#00f5ff" fill-opacity=".10" stroke="#00f5ff" stroke-opacity=".55"/>
        <text x="17" y="17" fill="#67e8f9">JAVA</text>
        <rect x="78" width="78" height="25" rx="5" fill="#8b5cf6" fill-opacity=".12" stroke="#a855f7" stroke-opacity=".6"/>
        <text x="94" y="17" fill="#c4b5fd">KOTLIN</text>
        <rect x="166" width="78" height="25" rx="5" fill="#ff2bd6" fill-opacity=".10" stroke="#ff2bd6" stroke-opacity=".55"/>
        <text x="181" y="17" fill="#f9a8d4">FABRIC</text>
        <rect x="254" width="88" height="25" rx="5" fill="#65d46e" fill-opacity=".09" stroke="#65d46e" stroke-opacity=".5"/>
        <text x="269" y="17" fill="#86efac">ANDROID</text>
      </g>
    </g>

    <g transform="translate(792 80)">
      <ellipse cx="215" cy="155" rx="190" ry="128" fill="#8b5cf6" opacity=".13" filter="url(#wideGlow)"/>

      <path d="M25 160 C78 55 160 55 226 160 C292 265 374 265 427 160 C374 55 292 55 226 160 C160 265 78 265 25 160"
            fill="none" stroke="#00f5ff" stroke-width="25" stroke-linecap="round" opacity=".22" filter="url(#glow)"/>
      <path d="M25 160 C78 55 160 55 226 160 C292 265 374 265 427 160 C374 55 292 55 226 160 C160 265 78 265 25 160"
            fill="none" stroke="url(#neon)" stroke-width="12" stroke-linecap="round" filter="url(#glow)">
        <animate attributeName="stroke-dasharray" values="32 8;8 14;32 8" dur="4s" repeatCount="indefinite"/>
      </path>

      <g transform="translate(165 103)" filter="url(#glow)">
        <path d="M61 0 122 35 61 70 0 35Z" fill="url(#cubeTop)"/>
        <path d="M0 35 61 70V140L0 105Z" fill="url(#cubeLeft)"/>
        <path d="M122 35 61 70V140L122 105Z" fill="url(#cubeRight)"/>
        <path d="M61 17 92 35 61 53 30 35Z" fill="#67e8f9" opacity=".9"/>
        <rect x="83" y="66" width="16" height="16" transform="rotate(-30 91 74)" fill="#f9a8d4"/>
        <animateTransform attributeName="transform" type="translate" values="165 103;165 93;165 103" dur="3.2s" repeatCount="indefinite"/>
      </g>

      <text x="226" y="338" text-anchor="middle" fill="#d8b4fe" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="3">INFINITY CORE // ACTIVE</text>
    </g>
  </g>

  <rect x="2" y="2" width="1276" height="416" rx="26" fill="none" stroke="url(#neon)" stroke-width="3" stroke-dasharray="34 14" opacity=".85" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-96" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
