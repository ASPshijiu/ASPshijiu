<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">诗酒 / ASPshijiu</title>
  <desc id="desc">Minecraft Mods, Android and Automation</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#11182d"/>
      <stop offset="1" stop-color="#17112a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7f9"/>
      <stop offset="0.52" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".32"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".07"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#background)"/>
  <rect width="1280" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1080" cy="165" r="265" fill="url(#glow)"/>

  <g opacity=".9">
    <rect x="72" y="58" width="13" height="13" rx="3" fill="#6ee7f9"/>
    <text x="100" y="70" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="700" letter-spacing="3">HELLO, WORLD</text>
  </g>

  <text x="70" y="152" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="58" font-weight="800">诗酒 / ASPshijiu</text>
  <rect x="72" y="178" width="310" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="70" y="230" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="500">把脑海里的点子，做成真正能跑的东西。</text>
  <text x="70" y="280" fill="#8b9bb4" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" letter-spacing="1.2">MINECRAFT MODS  •  ANDROID  •  AUTOMATION</text>

  <g transform="translate(930 56)">
    <circle cx="135" cy="125" r="94" fill="#8b5cf6" opacity=".16" filter="url(#softGlow)"/>

    <g transform="translate(12 18)">
      <path d="M122 0 230 61 122 122 14 61Z" fill="#a78bfa"/>
      <path d="M14 61 122 122V245L14 184Z" fill="#5b21b6"/>
      <path d="M230 61 122 122V245L230 184Z" fill="#7c3aed"/>

      <path d="M122 19 197 61 122 103 47 61Z" fill="#c4b5fd"/>
      <path d="M47 61 122 103V188L47 146Z" fill="#6d28d9"/>
      <path d="M197 61 122 103V188L197 146Z" fill="#8b5cf6"/>

      <rect x="78" y="59" width="24" height="24" transform="rotate(30 90 71)" fill="#67e8f9" opacity=".95"/>
      <rect x="149" y="85" width="22" height="22" transform="rotate(-30 160 96)" fill="#f472b6" opacity=".9"/>
    </g>

    <g fill="url(#accent)">
      <rect x="8" y="252" width="18" height="18" rx="3"/>
      <rect x="40" y="276" width="11" height="11" rx="2"/>
      <rect x="260" y="25" width="14" height="14" rx="3"/>
      <rect x="281" y="0" width="8" height="8" rx="2"/>
    </g>
  </g>

  <g transform="translate(70 321)" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
    <text>Java</text>
    <text x="66">Kotlin</text>
    <text x="150">TypeScript</text>
    <text x="266">Python</text>
  </g>
</svg>
