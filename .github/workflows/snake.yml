name: Generate contribution snake

on:
  schedule:
    - cron: "13 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate SVG animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff2bd6&color_dots=#ebedf0,#a5f3fc,#67e8f9,#a855f7,#ff2bd6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00f5ff&color_dots=#161b22,#0e7490,#7c3aed,#c026d3,#f472b6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
